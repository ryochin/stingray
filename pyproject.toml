[project]
name = "stingray"
# Not maintained: changes are tracked by date in CHANGELOG.md
version = "0.2.0"
description = "Self-hosted RSS/Atom reader with translation and summarization from a local LLM"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.18",
  "pydantic>=2.10",
  "defusedxml>=0.7",
  "beautifulsoup4>=4.12",
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "pyright>=1.1",
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
pythonPlatform = "All"
include = ["backend"]
extraPaths = ["backend"]
exclude = [
  "**/.venv",
  "**/__pycache__",
]

# Tests call private helpers on purpose to check them directly.
[[tool.pyright.executionEnvironments]]
root = "backend/tests"
reportPrivateUsage = false

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 2
# Tests import backend modules top-level (pytest pythonpath), so mark them first-party.
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # Line length is left to the formatter; it does not split long strings.
]
allowed-confusables = ["×"]

[tool.ruff.format]
quote-style = "double"
