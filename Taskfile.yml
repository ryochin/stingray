version: "3"

tasks:
  install:
    desc: "Install all dependencies"
    cmds:
      - uv sync
      - cd frontend && npm install

  dev:
    desc: "Start Vite dev server (proxies /api to backend at :20080)"
    dir: frontend
    cmds:
      - npm run dev

  build:
    desc: "Build frontend for production"
    dir: frontend
    cmds:
      - npm run build

  test:
    desc: "Run backend and frontend tests"
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: "Run backend tests inside the web container"
    cmds:
      - docker compose up -d
      - docker compose exec web uv run pytest backend

  test:frontend:
    desc: "Run frontend tests"
    dir: frontend
    cmds:
      - npm test

  coverage:
    desc: "Report backend and frontend test coverage"
    cmds:
      - task: coverage:backend
      - task: coverage:frontend

  coverage:backend:
    desc: "Report backend test coverage inside the web container"
    cmds:
      - docker compose up -d
      - docker compose exec web uv run pytest backend --cov

  coverage:frontend:
    desc: "Report frontend test coverage"
    dir: frontend
    cmds:
      - npm run test:coverage

  lint:
    desc: "Lint the backend and frontend"
    cmds:
      - task: lint:backend
      - task: lint:frontend

  lint:backend:
    desc: "Lint the backend with ruff and check its formatting"
    cmds:
      - uv run ruff check backend
      - uv run ruff format --check backend

  lint:frontend:
    desc: "Lint the frontend with Biome"
    dir: frontend
    cmds:
      - npm run lint

  lint:fix:
    desc: "Lint and auto-fix the backend and frontend"
    cmds:
      - task: lint:fix:backend
      - task: lint:fix:frontend

  lint:fix:backend:
    desc: "Lint, auto-fix and format the backend with ruff"
    cmds:
      - uv run ruff check backend --fix
      - uv run ruff format backend

  lint:fix:frontend:
    desc: "Lint and auto-fix the frontend with Biome"
    dir: frontend
    cmds:
      - npm run lint:fix

  clean:
    desc: "Remove all cached feed data"
    cmds:
      - rm -rf cache/
