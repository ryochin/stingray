name: Backend CI

# Only run when something the backend build actually depends on changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      # test_tick_matches_the_deployed_cron_cadence reads this file.
      - "crontab"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stingray
          POSTGRES_PASSWORD: stingray
          POSTGRES_DB: stingray
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stingray"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check (pyright)
        run: uv run pyright
      - name: Run tests (pytest)
        env:
          DATABASE_URL: postgresql://stingray:stingray@localhost:5432/stingray
          # Fail (don't skip) if the DB is unreachable, so the postgres service
          # wiring is actually exercised in CI.
          REQUIRE_DB: "1"
        run: uv run pytest backend
