name: Frontend CI

# Only run when something the frontend build actually depends on changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Type check (tsc)
        run: npx tsc -b
      - name: Run tests (Vitest)
        run: npm test
